[project]
name = "assay"
version = "0.1.0"
description = "Continuously falsifies the numbers an analytics stack already ships"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.0", "pydantic>=2.7", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
snowflake = ["snowflake-connector-python>=3.12"]

[project.scripts]
assay = "assay.run.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["assay*"]
